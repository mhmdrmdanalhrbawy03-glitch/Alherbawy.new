<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حساب العميل | مؤسسة الحرباوي</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><style>body{background:#f5f4ef}.account{max-width:620px;margin:35px auto;padding:18px}.account-card{background:#fff;border:1px solid #e7d9ae;border-radius:22px;padding:25px;box-shadow:0 12px 35px #0000000b}.field{width:100%;padding:13px;border:1px solid #ddd;border-radius:11px;margin:6px 0 14px}.account form{display:grid;gap:7px}.tabs{display:flex;gap:8px;margin:16px 0}.tabs button{flex:1;padding:12px;border:1px solid #c9a33a;border-radius:10px;background:#fff;font-weight:800}.tabs button.active{background:#171717;color:#f4d477}.primary-btn{background:#d7ad35;color:#111;border:0;padding:13px;border-radius:11px;font-weight:900}.muted{color:#777;line-height:1.8}#msg{white-space:pre-wrap;line-height:1.8}.profile-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0}.profile-item{background:#faf8f1;border:1px solid #eee2bd;border-radius:12px;padding:13px}.profile-item small{display:block;color:#777;margin-bottom:5px}.profile-item strong{overflow-wrap:anywhere}.account-order{border:1px solid #eadfbd;border-radius:13px;padding:14px;margin:10px 0}.account-order p{margin:7px 0;color:#666}@media(max-width:520px){.profile-grid{grid-template-columns:1fr}}</style><script defer src="admin-visibility.js"></script></head><body><div class="notice-bar">حسابات العملاء — مؤسسة الحرباوي</div><main class="account"><a href="index.html">← العودة للرئيسية</a><section class="account-card"><h1>مرحبًا بك في مؤسسة الحرباوي</h1><p class="muted">سجّل الدخول أو أنشئ حسابًا لتتمكن من إرسال طلباتك ومتابعتها.</p><div class="tabs"><button type="button" id="loginTab" class="active">تسجيل الدخول</button><button type="button" id="signupTab">إنشاء حساب جديد</button></div><form id="accountForm"><div id="nameWrap" hidden><label>الاسم الكامل<input class="field" id="fullName" autocomplete="name"></label><label>رقم الهاتف<input class="field" id="phone" autocomplete="tel" inputmode="tel"></label></div><label>البريد الإلكتروني<input class="field" id="email" type="email" autocomplete="email" required></label><label>كلمة المرور<input class="field" id="password" type="password" minlength="6" autocomplete="current-password" required></label><button class="primary-btn" id="submitBtn" type="submit">تسجيل الدخول</button></form><p id="msg" class="muted" aria-live="polite"></p><section id="accountDashboard" hidden><h2>بيانات حسابك</h2><div class="profile-grid"><div class="profile-item"><small>الاسم الكامل</small><strong id="profileName">—</strong></div><div class="profile-item"><small>رقم الهاتف</small><strong id="profilePhone">—</strong></div><div class="profile-item"><small>البريد الإلكتروني</small><strong id="profileEmail">—</strong></div><div class="profile-item"><small>تاريخ إنشاء الحساب</small><strong id="profileCreated">—</strong></div></div><h2>طلباتي السابقة</h2><div id="accountOrders" class="muted">جارٍ تحميل طلباتك...</div></section><button id="logout" class="primary-btn" type="button" hidden>تسجيل الخروج</button><p class="muted"><a href="my-orders.html">عرض طلباتي</a> · <a href="products.html">تصفح المنتجات</a></p></section></main><script src="account.js"></script></body></html>
