<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الإدارة | الحرباوي</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><style>body{background:#f5f5f2}.admin{max-width:1100px;margin:30px auto;padding:18px}.panel{background:#fff;border:1px solid #e5e5e5;border-radius:18px;padding:22px;margin:16px 0}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.formgrid label{display:grid;gap:6px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #eee;text-align:right;white-space:nowrap}button{cursor:pointer}.hidden{display:none!important}@media(max-width:650px){.formgrid{grid-template-columns:1fr}}</style></head><body><div class="notice-bar">لوحة إدارة مؤسسة الحرباوي — دخول مخصص للإدارة</div><main class="admin"><h1>لوحة التحكم <span style="color:#d5a400">◆</span></h1><section id="login" class="panel"><h2>تسجيل دخول الإدارة</h2><form id="loginForm" class="formgrid"><label>البريد الإلكتروني<input class="field" type="email" id="email" required></label><label>كلمة المرور<input class="field" type="password" id="password" required></label><button class="primary-btn" type="submit">دخول</button></form><p id="loginMsg"></p></section><section id="dashboard" class="hidden"><div class="panel" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><b>مرحبًا بك في إدارة المؤسسة</b><button class="dark-btn" id="logout">تسجيل خروج</button></div><div class="panel"><h2>إضافة / تعديل منتج</h2><form id="productForm" class="formgrid"><input type="hidden" id="pid"><label>اسم المنتج<input class="field" id="pname" required></label><label>القسم<input class="field" id="pcat" placeholder="دهانات / حدايد / كهرباء / سباكة / تشطيب" required></label><label>السعر (اختياري)<input class="field" id="pprice" type="number" min="0" step="0.01"></label><label>الوحدة<input class="field" id="punit" value="قطعة"></label><label>رابط الصورة<input class="field" id="pimage" type="url" placeholder="https://..."></label><label>الوصف<input class="field" id="pdesc"></label><label><input type="checkbox" id="pactive" checked> المنتج ظاهر للزوار</label><button class="primary-btn">حفظ المنتج</button><button type="button" class="dark-btn" id="clearForm">تفريغ الحقول</button></form><p id="productMsg"></p></div><div class="panel"><h2>المنتجات</h2><div class="tablewrap"><table><thead><tr><th>المنتج</th><th>القسم</th><th>السعر</th><th>ظاهر</th><th>إجراءات</th></tr></thead><tbody id="productsRows"></tbody></table></div></div><div class="panel"><h2>طلبات العملاء</h2><div class="tablewrap"><table><thead><tr><th>الاسم</th><th>الهاتف</th><th>التفاصيل</th><th>الحالة</th><th>التاريخ</th></tr></thead><tbody id="ordersRows"></tbody></table></div></div><div class="panel"><h2>استفسارات التواصل</h2><div class="tablewrap"><table><thead><tr><th>الاسم</th><th>الهاتف</th><th>النوع</th><th>التفاصيل</th><th>التاريخ</th></tr></thead><tbody id="inquiriesRows"></tbody></table></div></div></section></main><script src="admin.js"></script></body></html>
